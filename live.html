<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canlı Repertuar</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

.viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.list-area {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: calc(100% - 135px);
    overflow: hidden;
}

.scroll {
    position: absolute;
    left: 0;
    width: 100%;

    animation-name: yukariKay;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

.song {
    height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;
    padding: 0 10px;

    color: #000000;
    font-size: 28px;
    font-weight: 900;
    text-align: center;
    line-height: 1.05;

    text-shadow:
        1px 1px 2px rgba(255,255,255,0.95),
       -1px -1px 2px rgba(255,255,255,0.95),
        1px -1px 2px rgba(255,255,255,0.95),
       -1px 1px 2px rgba(255,255,255,0.95);
}

.qr-box {
    position: absolute;
    top: 8px;
    right: 8px;

    width: 118px;

    background: rgba(255,255,255,0.92);
    border-radius: 10px;

    padding: 6px;
    box-sizing: border-box;

    text-align: center;
}

.qr-box img {
    width: 100px;
    height: 100px;
    display: block;
    margin: auto;
}

.qr-text {
    margin-top: 4px;
    color: #000000;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.15;
}

@keyframes yukariKay {
    from {
        transform: translateY(100vh);
    }

    to {
        transform: translateY(-100%);
    }
}
</style>
</head>

<body>

<div class="viewport">

    <div class="list-area">
        <div class="scroll" id="scroll"></div>
    </div>

    <div class="qr-box">
        <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Filkerbilir.github.io%2Frepertuar%2F"
        alt="Repertuar QR">

        <div class="qr-text">
            TÜM REPERTUAR<br>
            QR KODU OKUT
        </div>
    </div>

</div>

<script>
async function repertuariYukle() {

    const scroll = document.getElementById("scroll");

    try {

        const response = await fetch(
            "./repertuar.json?v=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("JSON yüklenemedi");
        }

        const songs = await response.json();

        scroll.innerHTML = "";

        songs.forEach(song => {

            const div = document.createElement("div");
            div.className = "song";

            div.textContent =
    song.artist.toUpperCase() +
    " - " +
    song.title.toUpperCase();

            scroll.appendChild(div);

        });

        /*
        105 şarkı için yaklaşık 3,5 dakika.
        Daha önceki sürümden daha hızlı.
        */
        const animationTime = songs.length * 2;

        scroll.style.animationDuration =
            animationTime + "s";

    }

    catch (error) {

        scroll.innerHTML =
            '<div class="song">REPERTUAR YÜKLENEMEDİ</div>';

        console.error(error);
    }
}

repertuariYukle();
</script>

</body>
</html>
