<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canlı Repertuar</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

.viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/* KAYAN REPERTUAR */

.list-area {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;

    width: calc(100% - 150px);

    overflow: hidden;
}

.scroll {
    position: absolute;
    width: 100%;

    animation-name: kaydir;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
}

.song {
    height: 68px;

    display: flex;
    align-items: center;
    justify-content: center;

    box-sizing: border-box;

    padding: 0 12px;

    color: #000000;

    font-size: 29px;
    font-weight: 900;

    text-align: center;
    line-height: 1.05;

    /* Açık fonda okunaklı olsun */
    text-shadow:
        1px 1px 2px rgba(255,255,255,0.95),
       -1px -1px 2px rgba(255,255,255,0.95),
        1px -1px 2px rgba(255,255,255,0.95),
       -1px 1px 2px rgba(255,255,255,0.95);
}

.title {
    color: #000;
    font-size: 31px;
    font-weight: 900;
}

/* QR ALANI */

.qr-box {
    position: absolute;

    top: 10px;
    right: 10px;

    width: 125px;

    text-align: center;

    background: rgba(255,255,255,0.90);

    padding: 7px;

    border-radius: 10px;

    box-sizing: border-box;
}

.qr-box img {
    width: 110px;
    height: 110px;

    display: block;

    margin: auto;
}

.qr-text {
    margin-top: 4px;

    color: black;

    font-size: 15px;
    font-weight: 900;

    line-height: 1.1;
}

@keyframes kaydir {

    from {
        transform: translateY(100vh);
    }

    to {
        transform: translateY(-100%);
    }
}

</style>
</head>


<body>

<div class="viewport">

    <div class="list-area">

        <div class="scroll" id="scroll">

            <div class="song title">
                🎸 REPERTUAR
            </div>

        </div>

    </div>


    <div class="qr-box">

        <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=https%3A%2F%2Filkerbilir.github.io%2Frepertuar%2F"
        alt="Repertuar QR">

        <div class="qr-text">
            TÜM REPERTUAR<br>
            QR KODU OKUT
        </div>

    </div>

</div>


<script>

async function repertuariYukle() {

    try {

        const response = await fetch(
            "repertuar.json?t=" + Date.now()
        );

        const songs = await response.json();

        const scroll = document.getElementById("scroll");


        songs.forEach(song => {

            const div = document.createElement("div");

            div.className = "song";

            div.textContent =
                song.artist.toUpperCase() +
                " - " +
                song.title.toUpperCase();

            scroll.appendChild(div);

        });


        /*
        Her şarkı için yaklaşık 3 saniye.
        105 şarkı = yaklaşık 5 dakika.
        */

        const sure = Math.max(
            120,
            songs.length * 3
        );

        scroll.style.animationDuration =
            sure + "s";


    }

    catch (error) {

        document.getElementById("scroll").innerHTML =
        '<div class="song">REPERTUAR YÜKLENEMEDİ</div>';

        console.error(error);

    }

}

repertuariYukle();

</script>


</body>
</html>
